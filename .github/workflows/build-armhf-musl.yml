name: Build linux-armhf (armv7) with musl via cross (container)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-armhf-cross:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Ensure Docker is available
        run: |
          echo "Checking Docker availability"
          docker --version

      - name: Set up Rust (stable)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build with cross (container image)
        run: |
          echo "Running cross build inside container image"
          # Run cross container as current user to avoid permission issues with mounted files
          docker run --rm -u $(id -u):$(id -g) \
            -v "${{ github.workspace }}":/work -w /work \
            ghcr.io/cross-rs/cross:latest \
            cross build --target armv7-unknown-linux-musleabihf --release

      - name: List produced artifacts
        run: |
          echo "Host workspace listing of built artifacts:"
          ls -la target/release || true
          file target/release/* || true

      - name: Upload artifact (armhf musl)
        uses: actions/upload-artifact@v5
        with:
          name: matrix-helper-linux-armhf-musl
          path: target/release/*
