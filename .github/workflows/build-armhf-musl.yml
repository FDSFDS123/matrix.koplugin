name: Build linux-armv7-musleabihf (cross + vendored libolm)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  # Target triple
  TARGET: armv7-unknown-linux-musleabihf

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cross (cargo install)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install --locked cross || true
          cross --version || echo "cross not available yet"

      - name: Prepare vendor directory for libolm
        run: |
          mkdir -p olm-target/include olm-target/lib
          ls -la olm-target || true

      - name: Build libolm for armv7-musl (dockcross/musleabihf)
        run: |
          # This step attempts to build libolm for the musl armv7 target using a musl cross container.
          # The image name dockcross/musleabihf is used because it typically provides an armv7 musl toolchain.
          # If the image cannot be found on Docker Hub, the step will fail and we will iterate.
          echo "Attempting to build libolm for target ${TARGET} using dockcross/musleabihf"
          docker run --rm -v "${GITHUB_WORKSPACE}":/work -w /work --platform linux/amd64 dockcross/musleabihf:latest bash -lc '
            set -euo pipefail
            apt-get update -y
            apt-get install -y --no-install-recommends cmake git pkg-config build-essential ca-certificates
            # Work in a clean temp directory
            TMP=/tmp/olm_build
            rm -rf $TMP
            git clone --depth 1 https://gitlab.matrix.org/matrix-org/olm.git $TMP
            mkdir -p $TMP/build
            cd $TMP/build
            # Use a static build (no shared libs)
            cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
            make -j"$(nproc)"
            # Copy static archive and headers into mounted workspace (olm-target)
            mkdir -p /work/olm-target/lib /work/olm-target/include
            cp libolm.a /work/olm-target/lib/libolm.a
            cp -r ../include /work/olm-target/include
            echo "Copied libolm.a and headers to /work/olm-target"
          ' || (echo "Primary libolm build attempt failed; printing diagnostic info" && ls -la olm-target || true && exit 1)

      - name: Inspect vendored libolm artifacts
        run: |
          echo "olm-target contents:"
          ls -la olm-target || true
          file olm-target/lib/* || true
          echo "Head of an example header:"
          head -n 40 olm-target/include/olm/* || true

      - name: Build Rust binary with cross, linking vendored libolm
        env:
          PATH: ${{ github.workspace }}/.cargo/bin:$PATH
          # Tell the linker where to find vendored static library and headers
          LIBRARY_PATH: ${{ github.workspace }}/olm-target/lib:$LIBRARY_PATH
          C_INCLUDE_PATH: ${{ github.workspace }}/olm-target/include:$C_INCLUDE_PATH
          PKG_CONFIG_PATH: ${{ github.workspace }}/olm-target/lib/pkgconfig:$PKG_CONFIG_PATH
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          TARGET=${{ env.TARGET }}
          # Enable matrix-sdk dependency features explicitly (dependency-qualified)
          DEP_FEATURES="matrix-sdk/encryption matrix-sdk/sled_cryptostore"
          echo "Running cross build for ${TARGET} with dependency features: ${DEP_FEATURES}"
          # Print environment to help debugging
          echo "LIBRARY_PATH=$LIBRARY_PATH"
          echo "C_INCLUDE_PATH=$C_INCLUDE_PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          # Try the cross build
          cross build --release --target ${TARGET} --features "${DEP_FEATURES}"

      - name: Show produced artifacts
        run: |
          echo "Listing produced artifacts (target/${{ env.TARGET }}/release)"
          ls -la target/${{ env.TARGET }}/release || true
          file target/${{ env.TARGET }}/release/* || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: matrix-helper-linux-armv7-musleabihf
          path: target/${{ env.TARGET }}/release/*

      - name: Upload vendored libolm (for debugging)
        uses: actions/upload-artifact@v5
        with:
          name: olm-target
          path: olm-target
