name: Build linux-armv7 (armhf) with glibc < 2.20 (Debian Jessie / glibc 2.19)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-armhf-jessie:
    runs-on: ubuntu-latest
    env:
      # target triple for native build inside armhf container
      TARGET: armv7-unknown-linux-gnueabihf

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up QEMU (multiarch/binfmt) for emulation
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/arm/v7

      - name: Show runner info
        run: |
          uname -a
          lsb_release -a || true
          docker --version

      - name: Build inside emulated armhf Debian Jessie (glibc 2.19)
        # We mount the repo into /work so produced target/release ends up in the workflow workspace.
        run: |
          set -euo pipefail
          IMAGE=arm32v7/debian:jessie
          echo "Using container image: $IMAGE (emulated armhf via qemu)"
          docker run --rm --platform linux/arm/v7 \
            -v "${GITHUB_WORKSPACE}":/work -w /work \
            --env DEBIAN_FRONTEND=noninteractive \
            ${IMAGE} bash -lc '
              set -euo pipefail
              apt-get update -y
              apt-get install -y --no-install-recommends \
                build-essential cmake git pkg-config curl ca-certificates libssl-dev python3 \
                autoconf automake libtool gettext

              # Print glibc version to confirm target runtime (should be 2.19.x)
              echo "glibc version on build container:"
              ldd --version | head -n 1 || true

              # Build libolm (static) from upstream
              echo "Cloning and building libolm..."
              git clone --depth 1 https://gitlab.matrix.org/matrix-org/olm.git /tmp/olm
              mkdir -p /tmp/olm/build
              cd /tmp/olm/build
              cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
              make -j"$(nproc)"
              # install static lib and headers into /usr/local so linker finds them
              make install

              # Verify libolm static lib present
              ls -la /usr/local/lib/libolm.a || true
              ls -la /usr/local/include/olm || true

              # Install rustup and toolchain (native armhf inside the container)
              echo "Installing rustup..."
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
              chmod +x /tmp/rustup-init.sh
              /tmp/rustup-init.sh -y --no-modify-path
              export PATH=$HOME/.cargo/bin:$PATH
              rustup default stable
              rustup component add rustfmt || true

              # Build the Rust helper natively in this armhf container
              # Enable dependency features explicitly (dependency-qualified) for matrix-sdk
              DEP_FEATURES="matrix-sdk/encryption matrix-sdk/sled_cryptostore"
              echo "Building Rust binary (native) with features: ${DEP_FEATURES}"
              # Ensure environment can find libolm (installed to /usr/local)
              export LIBRARY_PATH=/usr/local/lib:$LIBRARY_PATH
              export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
              export C_INCLUDE_PATH=/usr/local/include:$C_INCLUDE_PATH
              # Run cargo build (this will create target/armv7-unknown-linux-gnueabihf/release if target dir is set,
              # but since we build natively, target/release will be produced)
              cargo build --release --features "${DEP_FEATURES}"

              # Show produced binary
              echo "Built artifacts under target/release:"
              ls -la target/release || true

              # Make sure the binary is world-readable in the mounted workspace
              chmod -R a+r target/release || true
            '

      - name: Collect and show produced binary
        run: |
          echo "Workspace target/release listing (host):"
          ls -la target/release || true
          file target/release/* || true

      - name: Upload artifact (armhf binary built on Jessie / glibc 2.19)
        uses: actions/upload-artifact@v5
        with:
          name: matrix-helper-linux-armhf-glibc-2.19
          path: target/release/*
