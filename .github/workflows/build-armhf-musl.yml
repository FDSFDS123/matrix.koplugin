name: Build linux-armv7-musleabihf (musl static) with E2EE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-musl-armv7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run musl cross container to build libolm + Rust binary
        # Using messense/rust-musl-cross which provides cross toolchains including armv7-musleabihf
        run: |
          set -euo pipefail
          # Target triple
          TARGET=armv7-unknown-linux-musleabihf
          # Use the official messense cross image for armv7 musl
          IMAGE=messense/rust-musl-cross:latest
          echo "Using image: $IMAGE"

          docker run --rm -v "${GITHUB_WORKSPACE}":/work -w /work --platform linux/amd64 $IMAGE bash -lc '
            set -euo pipefail

            apt-get update -y
            apt-get install -y --no-install-recommends cmake pkg-config git ca-certificates build-essential

            # Build libolm from upstream and install statically into /usr/local (the toolchain will pick it)
            git clone --depth 1 https://gitlab.matrix.org/matrix-org/olm.git /tmp/olm
            mkdir -p /tmp/olm/build
            cd /tmp/olm/build
            # Use the cross-compiler that messense image provides
            export CC=arm-linux-musleabihf-gcc
            export CXX=arm-linux-musleabihf-g++
            export AR=arm-linux-musleabihf-ar
            export RANLIB=arm-linux-musleabihf-ranlib
            cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
            make -j"$(nproc)"
            make install

            # Build Rust binary for the target. Ensure target is added by rustup in the image.
            export RUSTFLAGS="-C target-feature=+v7,+thumb2"
            cargo build --release --target '"$TARGET"' --features "encryption sled_cryptostore"

            echo "Build finished. Binaries available in target/$TARGET/release/"
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrix-helper-linux-armv7-musleabihf
          path: |
            target/armv7-unknown-linux-musleabihf/release/*
