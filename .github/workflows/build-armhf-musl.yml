name: Build linux-armv7-musleabihf (cross) with E2EE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-with-cross:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cross (cargo install)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # Install cross; the version may be updated later if desired
          cargo install --locked cross || true
          cross --version || echo "cross not available yet"

      - name: Build for armv7-unknown-linux-musleabihf with cross
        env:
          RUSTFLAGS: ""
          # If you vendor libolm or provide a custom path, set:
          # LIBOLM_DIR: ${{ github.workspace }}/olm-target
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          TARGET=armv7-unknown-linux-musleabihf
          FEATURES="encryption sled_cryptostore"
          echo "Building target ${TARGET} with features: ${FEATURES}"

          # If you need to vendor a prebuilt libolm static lib for the target, ensure
          # it is available under $LIBOLM_DIR/lib (libolm.a) and headers under $LIBOLM_DIR/include.
          # To instruct the C linker to find it you can set:
          # export LIBRARY_PATH="${LIBOLM_DIR}/lib:$LIBRARY_PATH"
          # export C_INCLUDE_PATH="${LIBOLM_DIR}/include:$C_INCLUDE_PATH"
          #
          # NOTE: If libolm is not present in the cross container images used by cross,
          # the build will likely fail with linking/compile errors. If that happens,
          # we can:
          #  - Add a preceding step that runs a container for the target and builds libolm,
          #    copying the static lib + headers into a repo directory (olm-target) that the
          #    subsequent cross run picks up via mounted workspace.
          #  - Or publish a custom cross image with libolm preinstalled and configure cross
          #    to use that image.
          #
          # Try the cross build now:
          cross build --release --target ${TARGET} --features "${FEATURES}"

      - name: Show produced artifacts (if any)
        run: |
          ls -la target/armv7-unknown-linux-musleabihf/release || true
          file target/armv7-unknown-linux-musleabihf/release/* || true

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: matrix-helper-linux-armv7-musleabihf
          path: target/armv7-unknown-linux-musleabihf/release/*
