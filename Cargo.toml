[package]
name = "matrix-e2ee-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core matrix sdk
matrix-sdk = { version = "0.7", default-features = false, features = ["e2e-encryption", "rustls-tls", "sqlite"] }

# Force SQLite to be compiled from C source and bundled statically
rusqlite = { version = "0.30.0", features = ["bundled"] }

# Other dependencies
ruma = "0.9"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"	
